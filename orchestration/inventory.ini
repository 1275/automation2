# Add Debian nodes under [linux]. Windows hosts can go in their own group later (WinRM).
# app_groups = which groups from apps.yml a machine gets (default: base). Examples:
#   deb-001122aabbcc ansible_user=ansible app_groups='["base","office"]'
#   deb-334455ddeeff ansible_user=ansible app_groups='["base","office","admin","dev"]'
[linux]
localhost ansible_connection=local
