#_preseed_V1
# Answers for the Debian 13 installer (written by setup-pxe-server.sh). Nothing is asked during install.
# Full list of options: https://www.debian.org/releases/trixie/example-preseed.txt
# Change locale, keyboard, time zone and software here.

### Language, keyboard, time
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string Etc/UTC
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

### Network (DHCP). The hostname comes from the iPXE menu (deb-<MAC>).
d-i netcfg/choose_interface select auto
d-i netcfg/get_domain string
d-i hw-detect/load_firmware boolean true

### Package mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates

### Accounts: no root password, one admin user "ansible" that logs in with the SSH key only.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Ansible automation
d-i passwd/username string ansible
d-i passwd/user-password-crypted password !

### Disk: the first disk, whole disk, LVM. ALL DATA ON IT IS ERASED.
d-i partman/early_command string debconf-set partman-auto/disk "$(list-devices disk | head -n1)"
d-i partman-auto/method string lvm
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true
# Encrypted disk (LUKS) instead: use these lines. The passphrase is in this file and travels over HTTP,
# so treat it as temporary: replace it after install (cryptsetup luksChangeKey) and bind the TPM (clevis).
#d-i partman-auto/method string crypto
#d-i partman-crypto/passphrase password CHANGE-ME-after-install
#d-i partman-crypto/passphrase-again password CHANGE-ME-after-install
#d-i partman-auto-crypto/erase_disks boolean false

### Software. Add "gnome-desktop" (or kde-desktop, xfce-desktop) for a desktop.
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo python3
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### Boot loader (shim + GRUB; with Secure Boot on, the signed versions are used)
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

### Hand over to Ansible: SSH key and password-less sudo for "ansible".
d-i preseed/late_command string \
  mkdir -p /target/home/ansible/.ssh; \
  wget -q -O /target/home/ansible/.ssh/authorized_keys http://@SERVER_IP@/authorized_keys; \
  in-target chown -R ansible:ansible /home/ansible/.ssh; \
  in-target chmod 700 /home/ansible/.ssh; \
  in-target chmod 600 /home/ansible/.ssh/authorized_keys; \
  echo 'ansible ALL=(ALL) NOPASSWD: ALL' > /target/etc/sudoers.d/ansible; \
  in-target chmod 440 /etc/sudoers.d/ansible

d-i finish-install/reboot_in_progress note
