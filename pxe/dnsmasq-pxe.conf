# Proxy DHCP + TFTP for network install (written by setup-pxe-server.sh).
# Proxy mode: the existing DHCP server still hands out IP addresses. dnsmasq only adds the boot file
# for PXE clients, so nothing changes for other devices on the network.
port=0                               # no DNS
interface=@IFACE@
dhcp-range=@SUBNET@,proxy
log-dhcp
enable-tftp
tftp-root=/srv/tftp

# UEFI x64 firmware (F12 -> network boot):
# iPXE shim (Microsoft signed) -> ipxe.efi (iPXE signed) -> autoexec.ipxe (menu).
pxe-service=X86-64_EFI,"Network install (iPXE)",ipxeboot/x86_64-sb/ipxe-shim.efi

# Fallback without iPXE, for machines that no longer trust "Microsoft UEFI CA 2011" (the iPXE 2.0.0 shim
# is signed only with that CA). Debian's own shim + GRUB, signed with the 2011 and 2023 CAs.
# Replace the line above with this one; the GRUB menu then comes from the Debian installer package.
#pxe-service=X86-64_EFI,"Network install (Debian shim)",debian-installer/amd64/bootnetx64.efi
